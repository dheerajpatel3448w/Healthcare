events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;   # for image uploads to AI service

    # ─── Rate Limiting Zones ─────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m   rate=5r/s;

    server {
        listen 80;
        server_name localhost;

        # ── Security Headers ──────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header X-XSS-Protection       "1; mode=block" always;

        # ════════════════════════════════════════════════════════════════════
        #  AUTH SERVICE  →  auth-service:4001
        #  app.use("/auth", router)
        #
        #  Rewrite:  /api/auth/*  →  /auth/*
        #
        #  Frontend env:  NEXT_PUBLIC_AUTH_API = http://localhost/api/auth
        #  Frontend call: /api/auth/login       →  service gets: /auth/login   ✅
        #  Frontend call: /api/auth/register    →  service gets: /auth/register ✅
        #  Frontend call: /api/auth/logout      →  service gets: /auth/logout  ✅
        #  Frontend call: /api/auth/me          →  service gets: /auth/me      ✅
        # ════════════════════════════════════════════════════════════════════
        location /api/auth/ {
            limit_req zone=auth_limit burst=15 nodelay;

            rewrite ^/api/auth/(.*)$ /$1 break;

            proxy_pass http://auth-service:4001;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header Cookie           $http_cookie;
        }

        # ════════════════════════════════════════════════════════════════════
        #  USER SERVICE  →  user-service:4002
        #  app.use("/profile", router)
        #
        #  Rewrite:  /api/user/*  →  /profile/*
        #
        #  Frontend env:  NEXT_PUBLIC_USER_API = http://localhost/api/user
        #  Frontend call: /api/user/create        →  /profile/create        ✅
        #  Frontend call: /api/user/getprofile    →  /profile/getprofile    ✅
        #  Frontend call: /api/user/updateprofile →  /profile/updateprofile ✅
        #  Frontend call: /api/user/deleteprofile →  /profile/deleteprofile ✅
        #  Frontend call: /api/user/:id           →  /profile/:id           ✅
        # ════════════════════════════════════════════════════════════════════
        location /api/user/ {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/user/(.*)$ /$1 break;

            proxy_pass http://user-service:4002;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header Cookie           $http_cookie;
        }

        # ════════════════════════════════════════════════════════════════════
        #  DOCTOR SERVICE  →  doctor-service:4003
        #  app.use("/doctor", doctorRoutes)
        #
        #  Rewrite:  /api/doctor/*  →  /doctor/*
        #
        #  Frontend env:  NEXT_PUBLIC_DOCTOR_API = http://localhost/api/doctor
        #  Frontend call: /api/doctor/all           →  /doctor/all           ✅
        #  Frontend call: /api/doctor/create        →  /doctor/create        ✅
        #  Frontend call: /api/doctor/getprofile    →  /doctor/getprofile    ✅
        #  Frontend call: /api/doctor/updateprofile →  /doctor/updateprofile ✅
        #  Frontend call: /api/doctor/:id           →  /doctor/:id           ✅
        # ════════════════════════════════════════════════════════════════════
        location /api/doctor/ {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/doctor/(.*)$ /$1 break;

            proxy_pass http://doctor-service:4003;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header Cookie           $http_cookie;
        }

        # ════════════════════════════════════════════════════════════════════
        #  APPOINTMENT SERVICE  →  appointment-service:4004
        #  app.use("/api/v1/appointments", appointmentRoutes)
        #
        #  Rewrite:  /api/appointment/*  →  /api/v1/appointments/*
        #
        #  Frontend env:  NEXT_PUBLIC_APPOINTMENT_API = http://localhost/api/appointment
        #  Frontend call: /api/appointment/create          →  /api/v1/appointments/create          ✅
        #  Frontend call: /api/appointment/my-appointments →  /api/v1/appointments/my-appointments ✅
        #  Frontend call: /api/appointment/doctor/:id      →  /api/v1/appointments/doctor/:id      ✅
        #  Frontend call: /api/appointment/:id/status      →  /api/v1/appointments/:id/status      ✅
        #  Frontend call: /api/appointment/:id/cancel      →  /api/v1/appointments/:id/cancel      ✅
        #  Frontend call: /api/appointment/:id/reschedule  →  /api/v1/appointments/:id/reschedule  ✅
        # ════════════════════════════════════════════════════════════════════
        location /api/appointment/ {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/appointment/(.*)$ /$1 break;

            proxy_pass http://appointment-service:4004;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header Cookie           $http_cookie;
        }

        # ════════════════════════════════════════════════════════════════════
        #  HABIT SERVICE  →  habit-service:4005
        #  app.use("/api/v1/habits", habitRoutes)  +  app.get("/health")
        #
        #  IMPORTANT: /api/habit/health is a special case — it maps to /health
        #  not to /api/v1/habits/health. Must be declared BEFORE the general block.
        #
        #  Frontend env:  NEXT_PUBLIC_HABIT_API = http://localhost/api/habit
        # ════════════════════════════════════════════════════════════════════

        # Health check — exact match, declared first so it wins
        location = /api/habit/health {
            rewrite ^/api/habit/health$ /health break;
            proxy_pass http://habit-service:4005;
            proxy_set_header Host $host;
        }

        # General habit routes
        #  Frontend call: /api/habit/goals   →  /api/v1/habits/goals   ✅
        #  Frontend call: /api/habit/log     →  /api/v1/habits/log     ✅
        #  Frontend call: /api/habit/today   →  /api/v1/habits/today   ✅
        #  Frontend call: /api/habit/streak  →  /api/v1/habits/streak  ✅
        #  Frontend call: /api/habit/trends  →  /api/v1/habits/trends  ✅
        #  Frontend call: /api/habit/tip     →  /api/v1/habits/tip     ✅
        location /api/habit/ {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/habit/(.*)$ /$1 break;

            proxy_pass http://habit-service:4005;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header Cookie           $http_cookie;
        }

        # ════════════════════════════════════════════════════════════════════
        #  AI SERVICE  →  ai-service:4006
        #  4 internal mounts:
        #    app.use("/images",    router)        → /images/*
        #    app.use("/analysis",  router2)       → /analysis/*
        #    app.use("/ai",        router3)        → /ai/*
        #    app.use("/doctor-ai", doctorAiRouter) → /doctor-ai/*
        #
        #  Rewrite:  /api/ai/*  →  /*   (strips only the /api/ai prefix)
        #
        #  Frontend env:  NEXT_PUBLIC_AI_API = http://localhost/api/ai
        #  Frontend call: /api/ai/images/upload      →  /images/upload      ✅
        #  Frontend call: /api/ai/images/reports     →  /images/reports     ✅
        #  Frontend call: /api/ai/analysis/history   →  /analysis/history   ✅
        #  Frontend call: /api/ai/ai/chat            →  /ai/chat            ✅
        #  Frontend call: /api/ai/ai/history         →  /ai/history         ✅
        #  Frontend call: /api/ai/doctor-ai/chat     →  /doctor-ai/chat     ✅
        #  Frontend call: /api/ai/doctor-ai/history  →  /doctor-ai/history  ✅
        #
        #  WebSocket (Socket.IO) is handled by /socket.io/ block below
        # ════════════════════════════════════════════════════════════════════
        location /api/ai/ {
            limit_req zone=ai_limit burst=10 nodelay;

            rewrite ^/api/ai/(.*)$ /$1 break;

            proxy_pass         http://ai-service:4006;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade          $http_upgrade;
            proxy_set_header   Connection       "upgrade";
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   Cookie           $http_cookie;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Socket.IO WebSocket ─────────────────────────────────────────────
        #  Browser connects to: ws://localhost/socket.io/...
        #  Nginx proxies directly to ai-service (no rewrite needed)
        location /socket.io/ {
            proxy_pass         http://ai-service:4006/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade          $http_upgrade;
            proxy_set_header   Connection       "upgrade";
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   Cookie           $http_cookie;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── Nginx Health Check ────────────────────────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "Nginx OK\n";
            add_header Content-Type text/plain;
        }

        # ════════════════════════════════════════════════════════════════════
        #  FRONTEND (Next.js)  →  frontend:3000
        #  Catch-all — MUST be last
        # ════════════════════════════════════════════════════════════════════
        location / {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade          $http_upgrade;
            proxy_set_header   Connection       "upgrade";
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
